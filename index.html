<!DOCTYPE html>

<html lang="ja" xmlns="http://www.w3.org/1999/xhtml">

<head>

    <meta charset="utf-8" />

    <title>アピール値計算</title>

    <style>

        .song_selector {
            width: 18rem;
            font-size: 1.1em;
        }

        .costume_selector {
            width: 21rem;
            font-size: 1.1em;
        }

        .accessory_selector {
            width: 21rem;
            font-size: 1.1em;
        }
    </style>

</head>

<body onload="body_onload()">

    <div>
        楽曲：<select class="song_selector" id="song_select" onchange="song_select_onchange()"></select>
    </div>

    <div>
        楽曲属性：<span id="song_bonus_text"></span>
    </div>

    <table>
        <thead>
            <tr>
                <th scope="col" colspan="2">衣装：<select class="costume_selector" id="costume_select" onchange="costume_select_onchange()"></select></th>
                <th scope="col">Vo</th>
                <th scope="col">Da</th>
                <th scope="col">Vi</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="row" colspan="2">衣装アピール値</th>
                <td id="costume_vo_text" align="right">0</td>
                <td id="costume_da_text" align="right">0</td>
                <td id="costume_vi_text" align="right">0</td>
            </tr>
            <tr>
                <th scope="row">着こなしLv</th>
                <td><select id="costume_level_select" onchange="costume_level_select_onchange()"></select></td>
                <td id="costume_bonus_vo_text" align="right">0</td>
                <td id="costume_bonus_da_text" align="right">0</td>
                <td id="costume_bonus_vi_text" align="right">0</td>
            </tr>
            <tr>
                <th scope="row">信頼度Lv</th>
                <td><select id="trustiness_level_select" onchange="trustiness_level_select_onchange()"></select></td>
                <td id="trustiness_bonus_vo_text" align="right">0</td>
                <td id="trustiness_bonus_da_text" align="right">0</td>
                <td id="trustiness_bonus_vi_text" align="right">0</td>
            </tr>
            <tr>
                <th scope="row" colspan="2">楽曲属性ボーナス値</th>
                <td id="song_bonus_vo_text" align="right">0</td>
                <td id="song_bonus_da_text" align="right">0</td>
                <td id="song_bonus_vi_text" align="right">0</td>
            </tr>
            <tr>
                <th scope="row" colspan="2">アイドルアピール値</th>
                <td id="idol_appeal_vo_text" align="right">0</td>
                <td id="idol_appeal_da_text" align="right">0</td>
                <td id="idol_appeal_vi_text" align="right">0</td>
            </tr>
            <tr>
                <th scope="row" colspan="2">頭：<select class="accessory_selector" id="accessory_head_select" onchange="accessory_select_onchange()"></select></th>
            </tr>
            <tr>
                <th scope="row" colspan="2">顔：<select class="accessory_selector" id="accessory_face_select" onchange="accessory_select_onchange()"></select></th>
            </tr>
            <tr>
                <th scope="row" colspan="2">手：<select class="accessory_selector" id="accessory_hand_select" onchange="accessory_select_onchange()"></select></th>
            </tr>
            <tr>
                <th scope="row" colspan="2">胴：<select class="accessory_selector" id="accessory_back_select" onchange="accessory_select_onchange()"></select></th>
            </tr>
            <tr>
                <th scope="row" colspan="2">腰：<select class="accessory_selector" id="accessory_rump_select" onchange="accessory_select_onchange()"></select></th>
            </tr>
            <tr>
                <th scope="row" colspan="2">脚：<select class="accessory_selector" id="accessory_legs_select" onchange="accessory_select_onchange()"></select></th>
            </tr>
        </tbody>
    </table>

    <div>
        総合アイドルアピール値：<span id="idol_appeal_total_text"></span>
    </div>

    <table border="1">
        <caption>着こなしボーナス</caption>
        <thead>
            <tr>
                <th scope="col">セット名</th>
                <th scope="col">効果</th>
                <th scope="col">衣装</th>
                <th scope="col">アクセサリ</th>
            </tr>
        </thead>
        <tbody id="set_bonus_tbody">
        </tbody>
    </table>

    <script src="Appeal.js"></script>

    <script src="BonusRates.js"></script>

    <script src="SongBonus.js"></script>
    <script src="SongBonusList.js"></script>

    <script src="Song.js"></script>
    <script src="SongList.js"></script>

    <script src="CostumeBonus.js"></script>
    <script src="CostumeBonusList.js"></script>

    <script src="Costume.js"></script>
    <script src="CostumeList.js"></script>

    <script src="Accessory.js"></script>
    <script src="AccessoryList.js"></script>

    <script src="SetBonus.js"></script>
    <script src="SetBonusList.js"></script>

    <script>

        class cookie_storage {

            song_id;

            costume_id;

            costume_level;

            trustiness_level;

            accessory_head_id;

            accessory_face_id;

            accessory_hand_id;

            accessory_back_id;

            accessory_rump_id;

            accessory_legs_id;

            //  コンストラクタ
            constructor(cookies) {

                this.song_id = 0;

                this.costume_id = 1;

                this.costume_level = 1;

                this.trustiness_level = 1;

                this.accessory_head_id = 0;

                this.accessory_face_id = 0;

                this.accessory_hand_id = 0;

                this.accessory_back_id = 0;

                this.accessory_rump_id = 0;

                this.accessory_legs_id = 0;

                try {

                    const cookieArray = cookies.split("/");

                    cookieArray.forEach((cookie) => {

                        const cookiePair = cookie.split("=");

                        const cookieKey = cookiePair[0].trim();

                        switch (cookieKey) {
                            case "song_id":

                                this.song_id = Number(decodeURIComponent(cookiePair[1]));
                                break;

                            case "costume_id":

                                this.costume_id = Number(decodeURIComponent(cookiePair[1]));
                                break;

                            case "costume_level":

                                this.costume_level = Number(decodeURIComponent(cookiePair[1]));
                                break;

                            case "trustiness_level":

                                this.trustiness_level = Number(decodeURIComponent(cookiePair[1]));
                                break;

                            case "accessory_head_id":

                                this.accessory_head_id = Number(decodeURIComponent(cookiePair[1]));
                                break;

                            case "accessory_face_id":

                                this.accessory_face_id = Number(decodeURIComponent(cookiePair[1]));
                                break;

                            case "accessory_hand_id":

                                this.accessory_hand_id = Number(decodeURIComponent(cookiePair[1]));
                                break;

                            case "accessory_back_id":

                                this.accessory_back_id = Number(decodeURIComponent(cookiePair[1]));
                                break;

                            case "accessory_rump_id":

                                this.accessory_rump_id = Number(decodeURIComponent(cookiePair[1]));
                                break;

                            case "accessory_legs_id":

                                this.accessory_legs_id = Number(decodeURIComponent(cookiePair[1]));
                                break;

                        }

                    })

                } catch (e) {

                }
            }

            build_cookies(age) {

                let cookies = "";

                cookies += "song_id" + "=" + encodeURIComponent(String(this.song_id)) + "/";

                cookies += "costume_id" + "=" + encodeURIComponent(String(this.costume_id)) + "/";

                cookies += "costume_level" + "=" + encodeURIComponent(String(this.costume_level)) + "/";

                cookies += "trustiness_level" + "=" + encodeURIComponent(String(this.trustiness_level)) + "/";

                cookies += "accessory_head_id" + "=" + encodeURIComponent(String(this.accessory_head_id)) + "/";

                cookies += "accessory_face_id" + "=" + encodeURIComponent(String(this.accessory_face_id)) + "/";

                cookies += "accessory_hand_id" + "=" + encodeURIComponent(String(this.accessory_hand_id)) + "/";

                cookies += "accessory_back_id" + "=" + encodeURIComponent(String(this.accessory_back_id)) + "/";

                cookies += "accessory_rump_id" + "=" + encodeURIComponent(String(this.accessory_rump_id)) + "/";

                cookies += "accessory_legs_id" + "=" + encodeURIComponent(String(this.accessory_legs_id)) + "/";

                cookies += "; " + "max-age" + "=" + age;

                return cookies;
            }
        }

        var cookieStorage;

        function object_clear_child_objects(object) {

            const options = object.options;

            let indexOptions = options.length;

            while (indexOptions > 0) {
                indexOptions--;

                object.removeChild(options.item(indexOptions));
            }
        }

        function select_clear_options(element_id) {

            const selectObject = document.getElementById(element_id);

            object_clear_child_objects(selectObject);
        }

        function object_add_option(object, value, text) {

            const option = document.createElement("option");

            option.value = value;
            option.text = text;

            object.add(option);
        }

        function select_add_option(element_id, value, text) {

            const selectObject = document.getElementById(element_id);

            object_add_option(selectObject, value, text);
        }

        function setup_song_select(song_id) {

            const selectSong = document.getElementById("song_select");

            object_clear_child_objects(selectSong);

            song_list.forEach((song) => {

                object_add_option(selectSong, song.id, song.name);
            });

            selectSong.value = song_id;
        }

        function setup_costume_select(costume_id) {

            const selectCostume = document.getElementById("costume_select");

            object_clear_child_objects(selectCostume);

            costume_list.forEach((costume) => {

                object_add_option(selectCostume, costume.id, costume.name);
            });

            selectCostume.value = costume_id;
        }

        function setup_costume_level_select(level_max, level) {

            const selectCostumeLevel = document.getElementById("costume_level_select");

            object_clear_child_objects(selectCostumeLevel);

            for (let level = level_max; level >= 1; level--) {

                object_add_option(selectCostumeLevel, level, level);
            }

            if (level < level_max) {

                selectCostumeLevel.value = level;
            } else {

                selectCostumeLevel.value = level_max;
            }
        }

        function setup_trustiness_level_select(level_max, level) {

            const selectTrustinessLevel = document.getElementById("trustiness_level_select");

            object_clear_child_objects(selectTrustinessLevel);

            for (let level = level_max; level >= 1; level--) {

                object_add_option(selectTrustinessLevel, level, level);
            }

            if (level < level_max) {

                selectTrustinessLevel.value = level;
            } else {

                selectTrustinessLevel.value = level_max;
            }
        }

        function setup_accessory_any_select(accessory_id, element_id, area_name) {

            const selectAccessory = document.getElementById(element_id);

            object_clear_child_objects(selectAccessory);

            accessory_list.forEach((accessory) => {

                let index_found = accessory.area_names.indexOf(area_name);

                if (index_found >= 0) {

                    object_add_option(selectAccessory, accessory.id, accessory.name);
                }
            });

            selectAccessory.value = accessory_id;
        }

        function setup_accessory_head_select(accessory_id) {

            setup_accessory_any_select(accessory_id, "accessory_head_select", "頭");
        }

        function setup_accessory_face_select(accessory_id) {

            setup_accessory_any_select(accessory_id, "accessory_face_select", "顔");
        }

        function setup_accessory_hand_select(accessory_id) {

            setup_accessory_any_select(accessory_id, "accessory_hand_select", "手");
        }

        function setup_accessory_back_select(accessory_id) {

            setup_accessory_any_select(accessory_id, "accessory_back_select", "胴");
        }

        function setup_accessory_rump_select(accessory_id) {

            setup_accessory_any_select(accessory_id, "accessory_rump_select", "腰");
        }

        function setup_accessory_legs_select(accessory_id) {

            setup_accessory_any_select(accessory_id, "accessory_legs_select", "脚");
        }

        function setup() {

            const cookies = document.cookie;

            cookieStorage = new cookie_storage(cookies);

            setup_song_select(cookieStorage.song_id);

            setup_costume_select(cookieStorage.costume_id);

            setup_costume_level_select(60, cookieStorage.costume_level);

            setup_trustiness_level_select(60, cookieStorage.trustiness_level);

            setup_accessory_head_select(cookieStorage.accessory_head_id);

            setup_accessory_face_select(cookieStorage.accessory_face_id);

            setup_accessory_hand_select(cookieStorage.accessory_hand_id);

            setup_accessory_back_select(cookieStorage.accessory_back_id);

            setup_accessory_rump_select(cookieStorage.accessory_rump_id);

            setup_accessory_legs_select(cookieStorage.accessory_legs_id);
        }

        function get_song_selected() {

            const selectSong = document.getElementById("song_select");

            const indexSong = selectSong.selectedIndex;

            return song_list[indexSong];
        }

        function get_costume_selected() {

            const selectCostume = document.getElementById("costume_select");

            const indexCostume = selectCostume.selectedIndex;

            return costume_list[indexCostume];
        }

        function get_costume_level_selected() {

            const selectCostumeLevel = document.getElementById("costume_level_select");

            return selectCostumeLevel.value;
        }

        function get_trustiness_level_selected() {

            const selectTrustinessLevel = document.getElementById("trustiness_level_select");

            return selectTrustinessLevel.value;
        }

        function redraw_song_informations(song) {

            const textSongBonus = document.getElementById("song_bonus_text");

            textSongBonus.textContent = song.bonus_text;
        }

        function redraw_costume_informations(costume) {

            const textCostumeVo = document.getElementById("costume_vo_text");
            const textCostumeDa = document.getElementById("costume_da_text");
            const textCostumeVi = document.getElementById("costume_vi_text");

            textCostumeVo.textContent = costume.appeal_base.vo;
            textCostumeDa.textContent = costume.appeal_base.da;
            textCostumeVi.textContent = costume.appeal_base.vi;

            setup_costume_level_select(costume.level_max, cookieStorage.costume_level);
        }

        function redraw_costume_bonus(costume_bonus_vo, costume_bonus_da, costume_bonus_vi) {

            const textCostumeBonusVo = document.getElementById("costume_bonus_vo_text");
            const textCostumeBonusDa = document.getElementById("costume_bonus_da_text");
            const textCostumeBonusVi = document.getElementById("costume_bonus_vi_text");

            textCostumeBonusVo.textContent = Math.floor(costume_bonus_vo);
            textCostumeBonusDa.textContent = Math.floor(costume_bonus_da);
            textCostumeBonusVi.textContent = Math.floor(costume_bonus_vi);
        }

        function redraw_trustiness_bonus(trustiness_bonus_vo, trustiness_bonus_da, trustiness_bonus_vi) {

            const textTrustinessBonusVo = document.getElementById("trustiness_bonus_vo_text");
            const textTrustinessBonusDa = document.getElementById("trustiness_bonus_da_text");
            const textTrustinessBonusVi = document.getElementById("trustiness_bonus_vi_text");

            textTrustinessBonusVo.textContent = Math.floor(trustiness_bonus_vo);
            textTrustinessBonusDa.textContent = Math.floor(trustiness_bonus_da);
            textTrustinessBonusVi.textContent = Math.floor(trustiness_bonus_vi);
        }

        function redraw_song_bonus(song_bonus_vo, song_bonus_da, song_bonus_vi) {

            const textSongBonusVo = document.getElementById("song_bonus_vo_text");
            const textSongBonusDa = document.getElementById("song_bonus_da_text");
            const textSongBonusVi = document.getElementById("song_bonus_vi_text");

            textSongBonusVo.textContent = Math.floor(song_bonus_vo);
            textSongBonusDa.textContent = Math.floor(song_bonus_da);
            textSongBonusVi.textContent = Math.floor(song_bonus_vi);
        }

        function redraw_idol_appeal(idol_appeal_vo, idol_appeal_da, idol_appeal_vi) {

            const textIdolAppealVo = document.getElementById("idol_appeal_vo_text");
            const textIdolAppealDa = document.getElementById("idol_appeal_da_text");
            const textIdolAppealVi = document.getElementById("idol_appeal_vi_text");
            const textIdolAppealTotal = document.getElementById("idol_appeal_total_text");

            const appeal_vo = Math.floor(idol_appeal_vo);
            const appeal_da = Math.floor(idol_appeal_da);
            const appeal_vi = Math.floor(idol_appeal_vi);
            const appeal_total = appeal_vo + appeal_da + appeal_vi;

            textIdolAppealVo.textContent = appeal_vo;
            textIdolAppealDa.textContent = appeal_da;
            textIdolAppealVi.textContent = appeal_vi;
            textIdolAppealTotal.textContent = appeal_total;
        }

        function redraw_set_bonus_list() {

            const tbodySetBonus = document.getElementById("set_bonus_tbody");

            while (tbodySetBonus.children.length > 0) {

                tbodySetBonus.deleteRow(tbodySetBonus.children.length - 1);
            }

            const selectCostume = document.getElementById("costume_select");

            const textCostume = selectCostume.selectedOptions[0].textContent;

            const selectAccessoryHead = document.getElementById("accessory_head_select");

            const textAccessoryHead = selectAccessoryHead.selectedOptions[0].textContent;

            cookieStorage.accessory_head_id = selectAccessoryHead.value;

            const selectAccessoryFace = document.getElementById("accessory_face_select");

            const textAccessoryFace = selectAccessoryFace.selectedOptions[0].textContent;

            cookieStorage.accessory_face_id = selectAccessoryFace.value;

            const selectAccessoryHand = document.getElementById("accessory_hand_select");

            const textAccessoryHand = selectAccessoryHand.selectedOptions[0].textContent;

            cookieStorage.accessory_hand_id = selectAccessoryHand.value;

            const selectAccessoryBack = document.getElementById("accessory_back_select");

            const textAccessoryBack = selectAccessoryBack.selectedOptions[0].textContent;

            cookieStorage.accessory_back_id = selectAccessoryBack.value;

            const selectAccessoryRump = document.getElementById("accessory_rump_select");

            const textAccessoryRump = selectAccessoryRump.selectedOptions[0].textContent;

            cookieStorage.accessory_rump_id = selectAccessoryRump.value;

            const selectAccessoryLegs = document.getElementById("accessory_legs_select");

            const textAccessoryLegs = selectAccessoryLegs.selectedOptions[0].textContent;

            cookieStorage.accessory_legs_id = selectAccessoryLegs.value;

            set_bonus_list.forEach((set_bonus) => {

                do {

                    let indexCostume = -1;

                    if (textCostume != "") {

                        if (set_bonus.costume_names.length > 0) {

                            indexCostume = set_bonus.costume_names.indexOf(textCostume);

                            if (indexCostume < 0) {

                                break;
                            }
                        }
                    }

                    let indexAccessoryHead = -1;

                    if (textAccessoryHead != "") {

                        if (set_bonus.head_names.length > 0) {

                            indexAccessoryHead = set_bonus.head_names.indexOf(textAccessoryHead);

                            if (indexAccessoryHead < 0) {

                                break;
                            }
                        }
                    }

                    let indexAccessoryFace = -1;

                    if (textAccessoryFace != "") {

                        if (set_bonus.face_names.length > 0) {

                            indexAccessoryFace = set_bonus.face_names.indexOf(textAccessoryFace);

                            if (indexAccessoryFace < 0) {

                                break;
                            }
                        }
                    }

                    let indexAccessoryHand = -1;

                    if (textAccessoryHand != "") {

                        if (set_bonus.hand_names.length > 0) {

                            indexAccessoryHand = set_bonus.hand_names.indexOf(textAccessoryHand);

                            if (indexAccessoryHand < 0) {

                                break;
                            }
                        }
                    }

                    let indexAccessoryBack = -1;

                    if (textAccessoryBack != "") {

                        if (set_bonus.back_names.length > 0) {

                            indexAccessoryBack = set_bonus.back_names.indexOf(textAccessoryBack);

                            if (indexAccessoryBack < 0) {

                                break;
                            }
                        }
                    }

                    let indexAccessoryRump = -1;

                    if (textAccessoryRump != "") {

                        if (set_bonus.rump_names.length > 0) {

                            indexAccessoryRump = set_bonus.rump_names.indexOf(textAccessoryRump);

                            if (indexAccessoryRump < 0) {

                                break;
                            }
                        }
                    }

                    let indexAccessoryLegs = -1;

                    if (textAccessoryLegs != "") {

                        if (set_bonus.legs_names.length > 0) {

                            indexAccessoryLegs = set_bonus.legs_names.indexOf(textAccessoryLegs);

                            if (indexAccessoryLegs < 0) {

                                break;
                            }
                        }
                    }

                    const tr = document.createElement("tr");

                    //  セット名
                    const td_name = document.createElement("td");

                    td_name.append(set_bonus.name);

                    tr.appendChild(td_name);

                    //  効果
                    const td_functions = document.createElement("td");

                    td_functions.append(set_bonus.functions);

                    tr.appendChild(td_functions);

                    //  衣装
                    const td_costume = document.createElement("td");

                    if (indexCostume < 0) {

                        let index = 0;

                        while (index < set_bonus.costume_names.length) {

                            if (index > 0) {

                                td_costume.append(" / ");
                            }

                            td_costume.append(set_bonus.costume_names[index]);

                            index += 1;
                        }
                    } else {

                        const b_costume = document.createElement("b");

                        b_costume.append(set_bonus.costume_names[indexCostume]);

                        td_costume.appendChild(b_costume);
                    }

                    tr.appendChild(td_costume);

                    //  アクセサリ
                    const td_accessory = document.createElement("td");

                    let exist_accessory = 0;

                    if (indexAccessoryHead < 0) {

                        let index = 0;

                        while (index < set_bonus.head_names.length) {

                            if (index > 0) {

                                td_accessory.append(" / ");
                            } else if (exist_accessory) {

                                td_accessory.appendChild(document.createElement("br"));
                            }

                            td_accessory.append(set_bonus.head_names[index]);

                            exist_accessory = 1;

                            index += 1;
                        }
                    } else {

                        if (exist_accessory) {

                            td_accessory.appendChild(document.createElement("br"));
                        }

                        const b_accessory = document.createElement("b");

                        b_accessory.append(set_bonus.head_names[indexAccessoryHead]);

                        td_accessory.appendChild(b_accessory);

                        exist_accessory = 1;
                    }

                    if (indexAccessoryFace < 0) {

                        let index = 0;

                        while (index < set_bonus.face_names.length) {

                            if (index > 0) {

                                td_accessory.append(" / ");
                            } else if (exist_accessory) {

                                td_accessory.appendChild(document.createElement("br"));
                            }

                            td_accessory.append(set_bonus.face_names[index]);

                            exist_accessory = 1;

                            index += 1;
                        }
                    } else {

                        if (exist_accessory) {

                            td_accessory.appendChild(document.createElement("br"));
                        }

                        const b_accessory = document.createElement("b");

                        b_accessory.append(set_bonus.face_names[indexAccessoryFace]);

                        td_accessory.appendChild(b_accessory);

                        exist_accessory = 1;
                    }

                    if (indexAccessoryHand < 0) {

                        let index = 0;

                        while (index < set_bonus.hand_names.length) {

                            if (index > 0) {

                                td_accessory.append(" / ");
                            } else if (exist_accessory) {

                                td_accessory.appendChild(document.createElement("br"));
                            }

                            td_accessory.append(set_bonus.hand_names[index]);

                            exist_accessory = 1;

                            index += 1;
                        }
                    } else {

                        if (exist_accessory) {

                            td_accessory.appendChild(document.createElement("br"));
                        }

                        const b_accessory = document.createElement("b");

                        b_accessory.append(set_bonus.hand_names[indexAccessoryHand]);

                        td_accessory.appendChild(b_accessory);

                        exist_accessory = 1;
                    }

                    if (indexAccessoryBack < 0) {

                        let index = 0;

                        while (index < set_bonus.back_names.length) {

                            if (index > 0) {

                                td_accessory.append(" / ");
                            } else if (exist_accessory) {

                                td_accessory.appendChild(document.createElement("br"));
                            }

                            td_accessory.append(set_bonus.back_names[index]);

                            exist_accessory = 1;

                            index += 1;
                        }
                    } else {

                        if (exist_accessory) {

                            td_accessory.appendChild(document.createElement("br"));
                        }

                        const b_accessory = document.createElement("b");

                        b_accessory.append(set_bonus.back_names[indexAccessoryBack]);

                        td_accessory.appendChild(b_accessory);

                        exist_accessory = 1;
                    }

                    if (indexAccessoryRump < 0) {

                        let index = 0;

                        while (index < set_bonus.rump_names.length) {

                            if (index > 0) {

                                td_accessory.append(" / ");
                            } else if (exist_accessory) {

                                td_accessory.appendChild(document.createElement("br"));
                            }

                            td_accessory.append(set_bonus.rump_names[index]);

                            exist_accessory = 1;

                            index += 1;
                        }
                    } else {

                        if (exist_accessory) {

                            td_accessory.appendChild(document.createElement("br"));
                        }

                        const b_accessory = document.createElement("b");

                        b_accessory.append(set_bonus.rump_names[indexAccessoryRump]);

                        td_accessory.appendChild(b_accessory);

                        exist_accessory = 1;
                    }

                    if (indexAccessoryLegs < 0) {

                        let index = 0;

                        while (index < set_bonus.legs_names.length) {

                            if (index > 0) {

                                td_accessory.append(" / ");
                            } else if (exist_accessory) {

                                td_accessory.appendChild(document.createElement("br"));
                            }

                            td_accessory.append(set_bonus.legs_names[index]);

                            exist_accessory = 1;

                            index += 1;
                        }
                    } else {

                        if (exist_accessory) {

                            td_accessory.appendChild(document.createElement("br"));
                        }

                        const b_accessory = document.createElement("b");

                        b_accessory.append(set_bonus.legs_names[indexAccessoryLegs]);

                        td_accessory.appendChild(b_accessory);

                        exist_accessory = 1;
                    }

                    tr.appendChild(td_accessory);

                    tbodySetBonus.appendChild(tr);

                } while (false);
            });
        }

        function calculate_appeal(song, costume) {

            const costume_level = get_costume_level_selected();

            const trustiness_level = get_trustiness_level_selected();

            cookieStorage.song_id = song.id;

            cookieStorage.costume_id = costume.id;

            cookieStorage.costume_level = costume_level;

            cookieStorage.trustiness_level = trustiness_level;

            let costume_bonus_vo;

            let costume_bonus_da;

            let costume_bonus_vi;

            if (costume_level <= 1) {

                costume_bonus_vo = 0;

                costume_bonus_da = 0;

                costume_bonus_vi = 0;
            } else if (costume_level <= 50) {

                costume_bonus_vo = costume_level * costume.appeal_base.vo * costume.bonus_rates.rate_vo / 10000;

                costume_bonus_da = costume_level * costume.appeal_base.da * costume.bonus_rates.rate_da / 10000;

                costume_bonus_vi = costume_level * costume.appeal_base.vi * costume.bonus_rates.rate_vi / 10000;
            } else {

                costume_bonus_vo = 50 * costume.appeal_base.vo * costume.bonus_rates.rate_vo / 10000
                    + (costume_level - 50) * costume.appeal_base.vo * costume.bonus_ex_rates.rate_vo / 10000;

                costume_bonus_da = 50 * costume.appeal_base.da * costume.bonus_rates.rate_da / 10000
                    + (costume_level - 50) * costume.appeal_base.da * costume.bonus_ex_rates.rate_da / 10000;

                costume_bonus_vi = 50 * costume.appeal_base.vi * costume.bonus_rates.rate_vi / 10000
                    + (costume_level - 50) * costume.appeal_base.vi * costume.bonus_ex_rates.rate_vi / 10000;
            }

            redraw_costume_bonus(costume_bonus_vo, costume_bonus_da, costume_bonus_vi);

            let trustiness_bonus_vo;

            let trustiness_bonus_da;

            let trustiness_bonus_vi;

            if (trustiness_level <= 1) {

                trustiness_bonus_vo = 0;

                trustiness_bonus_da = 0;

                trustiness_bonus_vi = 0;
            } else if (trustiness_level <= 60) {

                trustiness_bonus_vo = trustiness_level * costume.appeal_base.vo * 12 / 10000;

                trustiness_bonus_da = trustiness_level * costume.appeal_base.da * 12 / 10000;

                trustiness_bonus_vi = trustiness_level * costume.appeal_base.vi * 12 / 10000;
            }

            redraw_trustiness_bonus(trustiness_bonus_vo, trustiness_bonus_da, trustiness_bonus_vi);

            let song_bonus_vo = costume.appeal_base.vo * song.bonus_rates.rate_vo / 100;

            let song_bonus_da = costume.appeal_base.da * song.bonus_rates.rate_da / 100;

            let song_bonus_vi = costume.appeal_base.vi * song.bonus_rates.rate_vi / 100;

            redraw_song_bonus(song_bonus_vo, song_bonus_da, song_bonus_vi);

            let idol_appeal_vo = costume.appeal_base.vo
                + costume_bonus_vo
                + trustiness_bonus_vo
                + song_bonus_vo;

            let idol_appeal_da = costume.appeal_base.da
                + costume_bonus_da
                + trustiness_bonus_da
                + song_bonus_da;

            let idol_appeal_vi = costume.appeal_base.vi
                + costume_bonus_vi
                + trustiness_bonus_vi
                + song_bonus_vi;

            redraw_idol_appeal(idol_appeal_vo, idol_appeal_da, idol_appeal_vi);
        }

        function cookies_save() {

            const cookies = cookieStorage.build_cookies(30 * 24 * 60 * 60);

            document.cookie = cookies;
        }

        function body_onload() {

            setup();

            const song = get_song_selected();

            const costume = get_costume_selected();

            redraw_song_informations(song);

            redraw_costume_informations(costume);

            calculate_appeal(song, costume);

            redraw_set_bonus_list();
        }

        function song_select_onchange() {

            const song = get_song_selected();

            const costume = get_costume_selected();

            redraw_song_informations(song);

            calculate_appeal(song, costume);

            cookies_save();
        }

        function costume_select_onchange() {

            const song = get_song_selected();

            const costume = get_costume_selected();

            cookieStorage.costume_level = costume.level_max;

            redraw_costume_informations(costume);

            calculate_appeal(song, costume);

            redraw_set_bonus_list();

            cookies_save();
        }

        function accessory_select_onchange() {

            redraw_set_bonus_list();

            cookies_save();
        }

        function costume_level_select_onchange() {

            const song = get_song_selected();

            const costume = get_costume_selected();

            calculate_appeal(song, costume);
        }

        function trustiness_level_select_onchange() {

            const song = get_song_selected();

            const costume = get_costume_selected();

            calculate_appeal(song, costume);
        }

    </script>
