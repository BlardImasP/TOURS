    <script>

        function redrawDebugTBoby(listCard) {

            const tbodyDebug = document.getElementById("debug_tboby");

            if (tbodyDebug === undefined) {

                return;
            }

            clearElementChildren(tbodyDebug);

            listCard.forEach((card) => {

                const tr = document.createElement("tr");

                //  ID
                const thID = document.createElement("th");

                thID.scope = "row";

                thID.append(card.id);

                tr.appendChild(thID);

                //  シリーズ
                const tdSeries = document.createElement("td");

                tdSeries.append(card.series);

                tr.appendChild(tdSeries);

                //  レアリティ
                const tdRarity = document.createElement("td");

                tdRarity.append(card.rarity);

                tr.appendChild(tdRarity);

                //  カードタイプ
                const tdType = document.createElement("td");

                tdType.append(card.type);

                tr.appendChild(tdType);

                //  名称
                const tdName = document.createElement("td");

                tdName.append(card.name);

                tr.appendChild(tdName);

                //  アイドル
                const tdIdols = document.createElement("td");

                forEachAppendBr(card.idols, tdIdols, (idol) => {

                    tdIdols.append(idol);
                });

                tr.appendChild(tdIdols);

                //  説明
                const tdDescriptions = document.createElement("td");

                forEachAppendBr(card.descriptions, tdDescriptions, (description) => {

                    if (description[0] == "※") {

                        const bDescription = document.createElement("b");

                        bDescription.style.color = COLOR_DESCRIPTION_NOTE;

                        bDescription.append(description);

                        tdDescriptions.appendChild(bDescription);
                    } else {

                        tdDescriptions.append(description);
                    }
                });

                tr.appendChild(tdDescriptions);

                //  効果
                const tdFunctions = document.createElement("td");

                let demerit = false;

                forEachAppendBr(card.functions, tdFunctions, (func) => {

                    if (demerit) {

                        const fontFunction = document.createElement("font");

                        fontFunction.style.color = COLOR_SUPPORT_DEMERIT;

                        fontFunction.append(func);

                        tdFunctions.appendChild(fontFunction);
                    } else {

                        tdFunctions.append(func);

                        demerit = func.endsWith(WORD_SUPPORT_END_OF_MERIT);
                    }
                });

                tr.appendChild(tdFunctions);

                //  備考
                const tdRemarks = document.createElement("td");

                forEachAppendBr(card.remarks, tdRemarks, (remark) => {

                    tdRemarks.append(remark);
                });

                tr.appendChild(tdRemarks);

                tbodyDebug.appendChild(tr);
            });
        }

    </script>

    <script>

        function convertArrayToString(arraySource) {

            let result = "";

            if (arraySource.length > 0) {

                result = arraySource.join(" ");
            }

            return result;
        }

        function convertStringToArray(stringSource) {

            let result = [""];

            if (stringSource != "") {

                result = [""].concat(stringSource.split(" "));
            }

            return result;
        }

    </script>

    <script>

        function forEachAppendBr(array, element, action, countLine = 0) {

            if (array.length > 0) {

                if (countLine > 0) {

                    element.appendChild(document.createElement("br"));
                }

                array.forEach((item) => {

                    if (item != "") {

                        if (countLine > 0) {

                            element.appendChild(document.createElement("br"));
                        }

                        action(item);
                    }

                    countLine++;
                });
            }

            return countLine;
        }

    </script>

                    cookieArray.forEach((cookie) => {

                        switch (cookieKey) {

            saveValue(cookieKey, value, age = 90 * 24 * 60 * 60) {

                document.cookie = cookieCode;

        function calculateAppealCostumeBonus() {

            let bonusCostume = new Appeal();

            if ((2 <= cookieStorage.costume_level) && (cookieStorage.costume_level <= 50)) {

                bonusCostume.setAppeal(costumeSelected.appealBase);
                bonusCostume.multiply(cookieStorage.costume_level);
                bonusCostume.multiplyPerCent(costumeSelected.bonusRates);

            } else if ((51 <= cookieStorage.costume_level) && (cookieStorage.costume_level <= 60)) {

                bonusCostume.setAppeal(costumeSelected.appealBase);
                bonusCostume.multiply(50);
                bonusCostume.multiplyPerCent(costumeSelected.bonusRates);

                let bonusCostumeEx = new Appeal();

                bonusCostumeEx.setAppeal(costumeSelected.appealBase);
                bonusCostumeEx.multiply(cookieStorage.costume_level - 50);
                bonusCostumeEx.multiplyPerCent(costumeSelected.bonusRatesEx);

                bonusCostume.addAppeal(bonusCostumeEx);
            }

            return bonusCostume;
        }

        const ratesTrustinessBonus = new BonusRates(0.12, 0.12, 0.12);

        function calculateAppealTrustinessBonus() {

            let bonusTrustiness = new Appeal();

            if ((2 <= cookieStorage.trustiness_level) && (cookieStorage.trustiness_level <= 60)) {

                bonusTrustiness.setAppeal(costumeSelected.appealBase);
                bonusTrustiness.multiply(cookieStorage.trustiness_level);
                bonusTrustiness.multiplyPerCent(ratesTrustinessBonus);

            }

            return bonusTrustiness;
        }

        function calculateAppealSongBonus() {

            let bonusSong = new Appeal();

            bonusSong.setAppeal(costumeSelected.appealBase);
            bonusSong.multiplyPerCent(songSelected.bonusRates);

            return bonusSong;
        }

        function calculateAppealSupportBonus() {

            let bonusSupport1 = new Appeal();

            bonusSupport1.setAppeal(costumeSelected.appealBase);
            bonusSupport1.multiplyPerCent(support1Selected.bonusRates);

            let bonusSupport2 = new Appeal();

            bonusSupport2.setAppeal(costumeSelected.appealBase);
            bonusSupport2.multiplyPerCent(support2Selected.bonusRates);

            let bonusSupport3 = new Appeal();

            bonusSupport3.setAppeal(costumeSelected.appealBase);
            bonusSupport3.multiplyPerCent(support3Selected.bonusRates);

            let bonusSupport = new Appeal();

            bonusSupport.addAppeal(bonusSupport1);
            bonusSupport.addAppeal(bonusSupport2);
            bonusSupport.addAppeal(bonusSupport3);

            return bonusSupport;
        }

        function calculateAppeal() {

            const bonusCostume = calculateAppealCostumeBonus();

            redrawCostumeBonus(bonusCostume);

            const bonusTrustiness = calculateAppealTrustinessBonus();

            redrawTrustinessBonus(bonusTrustiness);

            const bonusSong = calculateAppealSongBonus();

            redrawSongBonus(bonusSong);

            const bonusSupport = calculateAppealSupportBonus();

            redrawSupportBonus(bonusSupport);

            let appealIdol = new Appeal();

            appealIdol.setAppeal(costumeSelected.appealBase);
            appealIdol.addAppeal(bonusCostume);
            appealIdol.addAppeal(bonusTrustiness);
            appealIdol.addAppeal(bonusSong);
            appealIdol.addAppeal(bonusSupport);

            redrawIdolAppeal(appealIdol);
        }
